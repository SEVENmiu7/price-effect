<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鐢电珯浠锋牸鏁寸悊鍣?路 鍦板尯鐗?/title>
  <style>
    :root {
      --paper: #f4f9ff;
      --panel: #ffffff;
      --ink: #10233f;
      --muted: #5b6f8c;
      --line: #c9daf3;
      --navy: #0847b8;
      --teal: #00a88f;
      --orange: #ff6b2c;
      --gold: #e5a500;
      --danger: #d92d45;
      --soft-danger: #fff0f3;
      --soft-teal: #e5fbf7;
      --shadow: 0 18px 50px rgba(18, 107, 255, .12);
      --radius: 14px;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(rgba(18, 107, 255, .045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(18, 107, 255, .045) 1px, transparent 1px),
        var(--paper);
      background-size: 24px 24px;
      font-family: "Microsoft YaHei UI", "PingFang SC", sans-serif;
    }

    button, input, select, textarea { font: inherit; }

    .app-shell {
      width: min(1540px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 24px 0 42px;
    }

    .masthead {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 24px;
      align-items: end;
      padding: 24px 26px;
      color: white;
      background: linear-gradient(120deg, #0755d9 0%, #087ee6 58%, #00b8d9 100%);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .masthead::after {
      content: "";
      position: absolute;
      width: 330px;
      height: 330px;
      right: -110px;
      top: -190px;
      border: 55px solid rgba(255, 255, 255, .13);
      border-radius: 50%;
      pointer-events: none;
    }

    .eyebrow {
      color: #bdf8ff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 8px 0 7px;
      font-family: "Microsoft YaHei", sans-serif;
      font-size: clamp(28px, 4vw, 46px);
      line-height: 1;
      letter-spacing: -.04em;
    }

    .subtitle {
      max-width: 780px;
      color: #d7e4e5;
      font-size: 14px;
      line-height: 1.7;
    }

    .scope-badge {
      position: relative;
      z-index: 1;
      padding: 12px 16px;
      border: 1px solid rgba(255, 255, 255, .24);
      background: rgba(255, 255, 255, .08);
      border-radius: 10px;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .control-strip {
      display: grid;
      grid-template-columns: minmax(160px, 240px) minmax(160px, 220px) 1fr;
      gap: 14px;
      align-items: end;
      margin: 18px 0;
      padding: 18px;
      background: rgba(255, 255, 255, .96);
      border: 1px solid rgba(207, 215, 213, .9);
      border-radius: var(--radius);
      box-shadow: 0 8px 28px rgba(22, 48, 54, .07);
    }

    .control label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    select, input[type="month"] {
      width: 100%;
      height: 44px;
      padding: 0 12px;
      color: var(--ink);
      background: white;
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: 0;
    }

    select:focus, input:focus, textarea:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(8, 127, 114, .12);
    }

    .control-note {
      align-self: center;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .schedule-panel {
      margin-bottom: 18px;
      padding: 18px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 8px 28px rgba(22, 48, 54, .06);
    }

    .panel-title-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 14px;
    }

    .panel-title-row h2 {
      margin: 0;
      font-size: 17px;
    }

    .panel-kicker {
      color: var(--muted);
      font-size: 12px;
    }

    .timeline {
      display: flex;
      min-height: 54px;
      overflow: hidden;
      border: 1px solid #bdc9c7;
      border-radius: 10px;
      background: #edf5ff;
    }

    .timeline-segment {
      min-width: 22px;
      display: grid;
      place-items: center;
      padding: 6px 4px;
      border-right: 1px solid rgba(255, 255, 255, .55);
      color: #17343a;
      font-size: 11px;
      font-weight: 900;
      text-align: center;
      line-height: 1.25;
    }

    .timeline-segment:last-child { border-right: 0; }
    .tone-1 { background: #50e3c2; }
    .tone-2 { background: #88f0db; }
    .tone-3 { background: #ffe15a; }
    .tone-4 { background: #ff9a62; }
    .tone-5 { background: #b9ddff; }

    .schedule-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .schedule-chip {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      padding: 7px 9px;
      color: #31464c;
      background: #f7fbff;
      border: 1px solid #c8dcf8;
      border-radius: 7px;
      font-size: 12px;
    }

    .schedule-chip strong { color: var(--navy); }

    .workspace {
      display: grid;
      grid-template-columns: minmax(330px, .72fr) minmax(680px, 1.65fr);
      gap: 18px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
      padding: 15px 17px;
      background: #edf6ff;
      border-bottom: 1px solid var(--line);
    }

    .panel-head h2 { margin: 0; font-size: 16px; }
    .step-no { color: var(--orange); font: 900 12px Consolas, monospace; }

    textarea {
      display: block;
      width: 100%;
      min-height: 560px;
      padding: 16px;
      resize: vertical;
      border: 0;
      border-bottom: 1px solid var(--line);
      outline: 0;
      color: #24373c;
      background: #ffffff;
      font: 14px/1.7 Consolas, "Microsoft YaHei UI", monospace;
    }

    .input-tools {
      display: grid;
      gap: 10px;
      padding: 14px;
    }

    .sample-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    .sample-lock {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .button-row { display: flex; flex-wrap: wrap; gap: 8px; }

    button {
      min-height: 40px;
      padding: 0 14px;
      border: 1px solid #b7ccec;
      border-radius: 8px;
      color: var(--ink);
      background: white;
      cursor: pointer;
      font-weight: 800;
      transition: transform .14s ease, box-shadow .14s ease, background .14s ease;
    }

    button:hover { transform: translateY(-1px); box-shadow: 0 7px 18px rgba(22, 48, 54, .1); }
    button.primary { color: white; background: var(--teal); border-color: var(--teal); }
    button.accent { color: white; background: var(--orange); border-color: var(--orange); }
    button.ghost-danger { color: var(--danger); border-color: #e4bdb7; background: #fff9f7; }

    .notice-stack {
      display: grid;
      gap: 8px;
      padding: 14px 14px 0;
    }

    .notice {
      padding: 10px 12px;
      border-left: 4px solid var(--teal);
      border-radius: 7px;
      color: #31534f;
      background: var(--soft-teal);
      font-size: 13px;
      line-height: 1.55;
    }

    .notice.warn { color: #78511e; background: #fff5da; border-color: var(--gold); }
    .notice.danger { color: #7e302d; background: var(--soft-danger); border-color: var(--danger); }

    .result-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 14px;
    }

    .table-wrap { overflow-x: auto; border-top: 1px solid var(--line); }

    table {
      width: 100%;
      min-width: 900px;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      padding: 10px 8px;
      border-bottom: 1px solid #e2e7e4;
      text-align: left;
      vertical-align: middle;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      color: #516269;
      background: #eef6ff;
      font-size: 11px;
      letter-spacing: .04em;
      white-space: nowrap;
    }

    tbody tr:hover { background: #fffaf0; }
    tbody tr.edited { background: #fff7e7; }
    tbody tr.error-row { background: #fff7f5; }

    .period-name { font-weight: 900; color: var(--navy); }
    .mono { font-family: Consolas, monospace; white-space: nowrap; }
    .source-cell { max-width: 220px; color: #51646a; line-height: 1.5; }

    .price-input {
      width: 86px;
      height: 38px;
      padding: 0 8px;
      border: 1px solid #c4cecc;
      border-radius: 7px;
      background: white;
      font: 800 14px Consolas, monospace;
      outline: 0;
    }

    .status {
      display: inline-flex;
      align-items: center;
      padding: 5px 7px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
    }

    .status.ok { color: #08695e; background: #daf0ea; }
    .status.review { color: #825a16; background: #fff0c8; }
    .status.missing { color: #943c36; background: #ffe2dd; }
    .status.manual { color: #874d18; background: #ffddb8; }

    .copy-console {
      margin: 0 14px 14px;
      border: 2px solid #8bbcff;
      border-radius: 12px;
      background: linear-gradient(135deg, #f7fbff, #ecf7ff);
      overflow: hidden;
    }

    .copy-console-head {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
      padding: 11px 13px;
      color: #073c97;
      background: #ddecff;
      border-bottom: 1px solid #b9d4fa;
      font-size: 13px;
      font-weight: 900;
    }

    .copy-console-head small { color: #5c7598; font-weight: 700; }

    .order-editor {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      padding: 10px 12px;
      border-bottom: 1px solid #cfe0f8;
    }

    .order-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 7px;
      color: #0a449f;
      background: white;
      border: 1px solid #9fc3f4;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
    }

    .order-pill button {
      min-height: 24px;
      width: 24px;
      padding: 0;
      border: 0;
      color: #126bff;
      background: #eaf3ff;
      border-radius: 50%;
      line-height: 1;
    }

    .copy-scroll { overflow-x: auto; padding: 12px; }

    .copy-labels, .copy-preview {
      display: grid;
      grid-template-columns: repeat(var(--copy-count, 1), minmax(108px, 1fr));
      min-width: calc(var(--copy-count, 1) * 108px);
    }

    .copy-labels span {
      padding: 0 8px 7px;
      color: #5b7193;
      font-size: 11px;
      font-weight: 800;
      text-align: center;
      white-space: nowrap;
    }

    .copy-preview {
      color: #10233f;
      background: white;
      border: 1px solid #b9d4fa;
      border-radius: 9px;
      font: 800 18px/1 Consolas, monospace;
    }

    .copy-preview span {
      padding: 14px 10px;
      border-right: 1px solid #d8e6f8;
      text-align: center;
      white-space: nowrap;
    }

    .copy-preview span:last-child { border-right: 0; }

    .copy-console-actions {
      display: flex;
      justify-content: flex-end;
      padding: 0 12px 12px;
    }

    details.audit {
      margin: 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fbfbf7;
    }

    details.audit summary {
      cursor: pointer;
      padding: 12px 13px;
      color: var(--navy);
      font-size: 13px;
      font-weight: 900;
    }

    .audit-body { padding: 0 13px 13px; }
    .audit-item { padding: 9px 0; border-top: 1px solid #e0e6e3; font-size: 12px; line-height: 1.6; }
    .audit-item strong { color: var(--navy); }

    footer {
      margin-top: 18px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
      text-align: center;
    }

    @media (max-width: 1080px) {
      .workspace { grid-template-columns: 1fr; }
      textarea { min-height: 390px; }
    }

    @media (max-width: 700px) {
      .app-shell { width: min(100% - 18px, 1540px); padding-top: 9px; }
      .masthead { grid-template-columns: 1fr; padding: 20px; }
      .scope-badge { justify-self: start; }
      .control-strip { grid-template-columns: 1fr 1fr; }
      .control-note { grid-column: 1 / -1; }
      .timeline-segment span { display: none; }
      .sample-row { grid-template-columns: 1fr; }
    }
  </style>
</head>

    function toMin(text) {

    function normalizeRawText(text) {

        .replace(/锛?g, ":")
        .replace(/[锝瀪鈥斺€撹嚦]/g, "-")
        .replace(/(\d{1,2}:\d{2})\s*\n\s*-\s*\n?\s*(\d{1,2}:\d{2})/g, "$1-$2")
        .replace(/(\d{1,2}:\d{2})\s*-\s*\n\s*(\d{1,2}:\d{2})/g, "$1-$2");
    }

    function normTime(text) {
      const normalized = String(text || "").replace(/锛?g, ":").replace(/[锝瀪鈥斺€撹嚦]/g, "-");
      const match = normalized.match(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/);
      if (!match) return null;
      const startH = Number(match[1]);
      const startM = Number(match[2]);
      const endH = Number(match[3]);
      const endM = Number(match[4]);
      if (startH > 24 || endH > 24 || startM > 59 || endM > 59) return null;
      const start = startH * 60 + startM;
      let end = endH * 60 + endM;
      if (endM === 59) end += 1;
      if (end === 0 && start > 0) end = 1440;
      return { start, end, label: `${String(startH).padStart(2, "0")}:${String(startM).padStart(2, "0")}-${String(endH).padStart(2, "0")}:${String(endM).padStart(2, "0")}` };
    }

    function getPositiveNumbers(line, minValue = 0.1) {
      if (normTime(line)) return [];
      return [...String(line).matchAll(/(?<![-锛峕)\b\d+(?:\.\d{1,4})\b/g)]
        .map(match => Number(match[0]))
        .filter(value => value >= minValue && value <= 3);
    }

    function isNumericOnlyLine(line) {
      const normalized = String(line).replace(/[鍏冨害\s/]/g, "");
      return /^\d+(?:\.\d{1,4})$/.test(normalized);
    }

    function isIgnoreLabel(line) {

    }

    function isPriceLabel(line) {
      if (isIgnoreLabel(line) || normTime(line)) return false;
      return /浼氬憳|VIP|榛戦捇|浼樻儬浠穦鎸傜墝浠穦鐢电珯浠穦绔欑偣浠穦蹇數浠穦闂仈浠穦鍗庤嚜浠穦YKC浠穦鍘熶环|鎶樻墸浠穦涓撲韩|娲诲姩浠穦鍏呯數鍗曚环|褰撳墠浠穦鏀惰垂閲戦/.test(line);
    }

    function nearlyEqual(a, b) {
      return Math.abs(a - b) < 0.0003;
    }

    function formulaTotal(window) {
      if (window.length === 3) {
        if (nearlyEqual(window[0] + window[1], window[2])) return window[2];
        if (nearlyEqual(window[1] + window[2], window[0])) return window[0];
        if (nearlyEqual(window[0] + window[2], window[1])) return window[1];
      }
      if (window.length === 4) {
        if (nearlyEqual(window[0] + window[1] - window[2], window[3])) return window[3];
        if (nearlyEqual(window[1] + window[2] - window[3], window[0])) return window[0];
      }
      return null;
    }

    function normalizePriceCandidates(prices) {
      const normalized = [];
      let i = 0;
      while (i < prices.length) {
        if (i + 3 < prices.length) {
          const total = formulaTotal(prices.slice(i, i + 4));
          if (total !== null) { normalized.push(total); i += 4; continue; }
        }
        if (i + 2 < prices.length) {
          const total = formulaTotal(prices.slice(i, i + 3));
          if (total !== null) { normalized.push(total); i += 3; continue; }
        }
        normalized.push(prices[i]);
        i++;
      }
      return normalized.filter(price => price >= 0.25 && price <= 3);
    }

    function collectGroupNumbers(lines, startIndex) {
      const prices = [];
      let endIndex = startIndex;
      for (let i = startIndex; i < lines.length; i++) {
        if (normTime(lines[i]) || (i !== startIndex && (isPriceLabel(lines[i]) || isIgnoreLabel(lines[i])))) break;
        const nums = getPositiveNumbers(lines[i]);
        if (nums.length) prices.push(...nums);
        endIndex = i;
      }
      return { endIndex, prices: normalizePriceCandidates(prices) };
    }

    function parsePriceGroups(lines) {
      const groups = [];
      let i = 0;
      while (i < lines.length) {
        if (normTime(lines[i])) { i++; continue; }
        if (isIgnoreLabel(lines[i])) {
          i++;
          while (i < lines.length && !normTime(lines[i]) && !isPriceLabel(lines[i])) i++;
          continue;
        }
        if (isPriceLabel(lines[i])) {
          const sameLine = getPositiveNumbers(lines[i]);
          const collected = collectGroupNumbers(lines, i + 1);
          const prices = normalizePriceCandidates([...sameLine, ...collected.prices]);
          if (prices.length) {
            groups.push({ label: lines[i], start: i, end: collected.endIndex, prices });
          } else {
            let timeIndex = -1;
            for (let j = i + 1; j < lines.length; j++) {
              if (isPriceLabel(lines[j])) break;
              if (normTime(lines[j])) { timeIndex = j; break; }
            }
            if (timeIndex !== -1) {
              const afterTime = collectGroupNumbers(lines, timeIndex + 1);
              if (afterTime.prices.length) {
                groups.push({ label: lines[i], start: timeIndex + 1, end: afterTime.endIndex, prices: afterTime.prices });
                i = Math.max(afterTime.endIndex + 1, i + 1);
                continue;
              }
            }
          }
          i = Math.max(collected.endIndex + 1, i + 1);
          continue;
        }
        if (getPositiveNumbers(lines[i]).length) {
          const collected = collectGroupNumbers(lines, i);
          if (collected.prices.length) groups.push({ label: "鏈爣娉ㄤ环鏍肩粍", start: i, end: collected.endIndex, prices: collected.prices });
          i = collected.endIndex + 1;
          continue;
        }
        i++;
      }
      return groups;
    }

    function isUnlabeledGroup(group) { return !group.label || group.label.includes("鏈爣娉?); }
    function normalizeLabel(label) { return String(label || "").replace(/\s+/g, "").trim(); }
    const UNLABELED_TEMPLATE = "__UNLABELED__";

    function previousTimeForGroup(timeItems, position) {
      let result = null;
      for (const item of timeItems) {
        if (item.index < position) result = item;
        else break;
      }
      return result;
    }

    function nextTimeForGroup(timeItems, position) {
      return timeItems.find(item => item.index > position) || null;
    }

    function hasLeadingUnlabeledGroups(timeItems, groups) {
      return timeItems.some(timeItem => groups.some(group => isUnlabeledGroup(group) && group.start > timeItem.index && group.start - timeItem.index <= 3));
    }

    function inferLabelTemplate(groups, timeItems) {
      const labels = groups.filter(group => !isUnlabeledGroup(group)).map(group => normalizeLabel(group.label));
      const hasLeadingUnlabeled = hasLeadingUnlabeledGroups(timeItems, groups);
      const uniqueLabels = [...new Set(labels)];
      if (hasLeadingUnlabeled && uniqueLabels.length === 1 && labels.length >= 2) return [UNLABELED_TEMPLATE, uniqueLabels[0]];
      if (labels.length < 4) return [];
      for (let size = 2; size <= Math.min(4, Math.floor(labels.length / 2)); size++) {
        const template = labels.slice(0, size);
        if (new Set(template).size !== template.length) continue;
        let matches = 0;
        for (let i = 0; i < labels.length; i++) if (labels[i] === template[i % size]) matches++;
        if (matches / labels.length >= .75) return hasLeadingUnlabeled ? [UNLABELED_TEMPLATE, ...template] : template;
      }
      return [];
    }

    function labelIndexInTemplate(group, template) {
      if (isUnlabeledGroup(group)) return template.findIndex(item => item === UNLABELED_TEMPLATE);
      return template.findIndex(item => item === normalizeLabel(group.label));
    }

    function assignGroupsByTemplate(timeItems, groups, template) {
      const byTimeIndex = new Map(timeItems.map(item => [item.index, []]));
      const used = new Set();
      for (let t = 0; t < timeItems.length; t++) {
        const prevTimeIndex = t ? timeItems[t - 1].index : -1;
        const current = timeItems[t];
        const nextTimeIndex = t < timeItems.length - 1 ? timeItems[t + 1].index : Infinity;
        const selected = [];
        const selectedLabels = new Set();
        const tryTake = (group, source) => {
          const templateIndex = labelIndexInTemplate(group, template);
          if (templateIndex === -1 || selectedLabels.has(templateIndex) || used.has(group)) return false;
          selected.push({ ...group, source });
          selectedLabels.add(templateIndex);
          used.add(group);
          return selectedLabels.size === template.length;
        };
        const beforeGroups = groups.filter(group => !used.has(group) && !isUnlabeledGroup(group) && group.start > prevTimeIndex && group.end < current.index);
        for (const group of beforeGroups) if (tryTake(group, "鍓嶇疆浠锋牸缁?)) break;
        const afterGroups = groups.filter(group => !used.has(group) && !isUnlabeledGroup(group) && group.start > current.index && group.start < nextTimeIndex);
        for (const group of afterGroups) if (tryTake(group, "鍚庣疆浠锋牸缁?)) break;
        if (selected.length) byTimeIndex.set(current.index, selected);
      }
      return { byTimeIndex, used };
    }

    function assignGroupsToSections(timeItems, groups) {
      const template = inferLabelTemplate(groups, timeItems);
      if (template.length) {
        const templated = assignGroupsByTemplate(timeItems, groups, template);
        for (const group of groups) {
          if (templated.used.has(group) || !isUnlabeledGroup(group)) continue;
          const owner = previousTimeForGroup(timeItems, group.start) || nextTimeForGroup(timeItems, group.end);
          if (owner && !(templated.byTimeIndex.get(owner.index) || []).length) templated.byTimeIndex.get(owner.index).push({ ...group, source: "鏈爣娉ㄤ环鏍肩粍" });
        }
        templated.byTimeIndex.template = template;
        return templated.byTimeIndex;
      }
      const byTimeIndex = new Map(timeItems.map(item => [item.index, []]));
      for (const group of groups) {
        const prev = previousTimeForGroup(timeItems, group.start);
        const next = nextTimeForGroup(timeItems, group.end);
        let owner = prev || next;
        if (prev && next) {
          const prevDistance = group.start - prev.index;
          const nextDistance = next.index - group.end;
          owner = prevDistance <= 2 ? prev : (nextDistance < prevDistance ? next : prev);
        }
        if (owner) byTimeIndex.get(owner.index).push({ ...group, source: prev && next && owner === next ? "鍓嶇疆浠锋牸缁? : "鍚庣疆浠锋牸缁? });
      }
      return byTimeIndex;
    }

    function uniqueSorted(prices) {
      return [...new Set(prices.map(price => Number(price).toFixed(4)))].map(Number).sort((a, b) => a - b);
    }

    function parseSections(text) {
      const lines = normalizeRawText(text).split("\n").map(line => line.trim()).filter(Boolean);
      const timeItems = [];
      lines.forEach((line, index) => {
        const time = normTime(line);
        if (time) timeItems.push({ index, ...time });
      });
      const groups = parsePriceGroups(lines);
      const groupsByTime = assignGroupsToSections(timeItems, groups);
      const sections = timeItems.map((timeItem, pos) => {
        const nextTimeIndex = pos < timeItems.length - 1 ? timeItems[pos + 1].index : lines.length;
        const sectionGroups = groupsByTime.get(timeItem.index) || [];
        return { ...timeItem, prices: uniqueSorted(sectionGroups.flatMap(group => group.prices)), groups: sectionGroups, raw: lines.slice(timeItem.index, nextTimeIndex) };
      });
      const merged = new Map();
      for (const section of sections) {
        const key = `${section.start}-${section.end}`;
        if (!merged.has(key)) merged.set(key, { ...section, duplicates: 1 });
        else {
          const current = merged.get(key);
          current.duplicates += 1;
          current.prices = uniqueSorted([...current.prices, ...section.prices]);
          current.groups.push(...section.groups);
        }
      }
      return [...merged.values()];
    }

    function chooseForTarget(sections, target) {
      const start = toMin(target.start);
      const end = toMin(target.end);
      const matched = sections.filter(section => section.end > start && section.start < end);
      const available = matched.map(section => ({ section, prices: uniqueSorted(section.prices) })).filter(item => item.prices.length);
      if (!available.length) return { member: "", nonMember: "", matched, available, status: "missing", note: "鏈瘑鍒埌鏈夋晥鎬讳环" };
      let best = available[0];
      for (const item of available) if (item.prices[0] < best.prices[0]) best = item;
      const member = best.prices[0];
      const nonMember = best.prices.length === 1 ? member : best.prices[1];
      const status = best.prices.length === 1 || matched.length > 1 ? "review" : "ok";
      const notes = [];
      if (best.prices.length === 1) notes.push("鍙湁涓€涓€讳环锛屽凡鎸夊悓浠峰鐞?);
      if (matched.length > 1) notes.push("鍛戒腑澶氫釜瀹為檯鏃舵锛屽彇鏈€浣庝細鍛樹环鎵€鍦ㄤ环鏍肩粍");
      if (!notes.length) notes.push("宸插彇鏈€浣庝袱涓湁鏁堟€讳环");
      return { member, nonMember, matched, available, best, status, note: notes.join("锛?) };
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
    }

    function renderSchedule() {
      const config = REGION_CONFIGS[regionSelect.value];
      const month = effectiveMonth.value || "鏈缃?;
      document.getElementById("scheduleTitle").textContent = `${config.name}鍏ㄥぉ鏃舵`;
      document.getElementById("scheduleMeta").textContent = `褰撳墠閰嶇疆 路 ${month}`;
      document.getElementById("timeline").innerHTML = config.periods.map(period => {
        const width = (toMin(period.end) - toMin(period.start)) / 1440 * 100;
        return `<div class="timeline-segment tone-${period.tone}" style="width:${width}%" title="${period.start}-${period.end} ${period.name}"><span>${escapeHtml(period.name)}</span></div>`;
      }).join("");
      document.getElementById("scheduleList").innerHTML = config.periods.map(period => `<div class="schedule-chip"><strong>${escapeHtml(period.name)}</strong><span class="mono">${period.start}-${period.end}</span></div>`).join("");
      if (!resultRows.length) renderEmptyRows();
    }

    function renderEmptyRows() {
      const config = REGION_CONFIGS[regionSelect.value];
      const selection = getRegionSelection();
      resultRows = config.periods.map((period, index) => ({ index, period, selected: selection.selected.includes(periodId(period)), member: "", nonMember: "", matched: [], available: [], status: "missing", note: "绛夊緟璇嗗埆", edited: false }));
      parsedSections = [];
      renderResults();
      noticeStack.innerHTML = `<div class="notice">宸茶浇鍏?${config.name} ${config.periods.length} 涓叏澶╂椂娈点€傜矘璐?OCR 鏂囨湰鍚庣偣鍑烩€滄暣鐞嗕环鏍尖€濄€?/div>`;
    }

    function analyse() {
      const text = rawInput.value.trim();
      if (!text) {
        renderEmptyRows();
        noticeStack.innerHTML = `<div class="notice danger">璇峰厛绮樿创 OCR 鏂囨湰锛屾垨杞藉叆涓€涓洖褰掓牱渚嬨€?/div>`;
        return;
      }
      parsedSections = parseSections(text);
      const config = REGION_CONFIGS[regionSelect.value];
      const selection = getRegionSelection();
      resultRows = config.periods.map((period, index) => ({ index, period, selected: selection.selected.includes(periodId(period)), edited: false, ...chooseForTarget(parsedSections, period) }));
      renderResults();
      renderNotices();
      renderAudit();
    }

    function renderResults() {
      resultBody.innerHTML = resultRows.map(row => {
        const matched = row.matched.length ? row.matched.map(item => item.label).join("銆?) : "鈥?;
        const candidates = row.available.length ? uniqueSorted(row.available.flatMap(item => item.prices)).map(v => v.toFixed(4)).join(" / ") : "鈥?;
        const statusClass = row.edited ? "manual" : row.status;
        const statusText = row.edited ? "浜哄伐淇敼" : ({ ok: "宸茶瘑鍒?, review: "闇€澶嶆牳", missing: "缂哄け" }[row.status] || "寰呭鐞?);
        return `<tr data-row-index="${row.index}" class="${row.edited ? "edited" : ""} ${row.status === "missing" ? "error-row" : ""}">
          <td><input type="checkbox" class="row-select" ${row.selected ? "checked" : ""} aria-label="閫夋嫨 ${escapeHtml(row.period.name)} ${row.period.start}-${row.period.end}"></td>
          <td><span class="period-name">${escapeHtml(row.period.name)}</span></td>
          <td class="mono">${row.period.start}-${row.period.end}</td>
          <td class="source-cell mono">${escapeHtml(matched)}</td>
          <td class="source-cell mono">${escapeHtml(candidates)}</td>
          <td><input class="price-input" data-kind="nonMember" inputmode="decimal" value="${row.nonMember !== "" ? Number(row.nonMember).toFixed(4) : ""}" aria-label="${escapeHtml(row.period.name)}闈炰細鍛樹环"></td>
          <td><input class="price-input" data-kind="member" inputmode="decimal" value="${row.member !== "" ? Number(row.member).toFixed(4) : ""}" aria-label="${escapeHtml(row.period.name)}浼氬憳浠?></td>
          <td><span class="status ${statusClass}" title="${escapeHtml(row.note)}">${statusText}</span></td>
        </tr>`;
      }).join("");
      bindResultEvents();
      updateCopyPreview();
    }

    function bindResultEvents() {
      resultBody.querySelectorAll("tr").forEach(tr => {
        const row = resultRows[Number(tr.dataset.rowIndex)];
        tr.querySelector(".row-select").addEventListener("change", event => {
          row.selected = event.target.checked;
          const state = getRegionSelection();
          const id = periodId(row.period);
          if (row.selected) {
            if (!state.selected.includes(id)) state.selected.push(id);
            if (!state.order.includes(id)) state.order.push(id);
          } else {
            state.selected = state.selected.filter(item => item !== id);
            state.order = state.order.filter(item => item !== id);
          }
          updateCopyPreview();
        });
        tr.querySelectorAll(".price-input").forEach(input => input.addEventListener("input", event => {
          row[event.target.dataset.kind] = event.target.value.trim();
          row.edited = true;
          tr.classList.add("edited");
          const chip = tr.querySelector(".status");
          chip.className = "status manual";
          chip.textContent = "浜哄伐淇敼";
          updateCopyPreview();
        }));
      });
    }

    function renderNotices() {
      const notices = [];
      if (!parsedSections.length) notices.push({ type: "danger", text: "娌℃湁璇嗗埆鍒版椂闂存锛岃妫€鏌?OCR 鏂囨湰涓殑鏃堕棿鏍煎紡銆? });
      else notices.push({ type: "", text: `璇嗗埆鍒?${parsedSections.length} 涓幓閲嶅悗鐨勫疄闄呮椂娈碉紱鍦板尯鐩爣鏃舵涓?${resultRows.length} 涓€俙 });
      const missing = resultRows.filter(row => row.status === "missing").length;
      const review = resultRows.filter(row => row.status === "review").length;
      if (missing) notices.push({ type: "danger", text: `${missing} 涓洰鏍囨椂娈垫病鏈夋湁鏁堜环鏍硷紝蹇呴』浜哄伐琛ュ綍銆俙 });
      if (review) notices.push({ type: "warn", text: `${review} 涓洰鏍囨椂娈垫寜鍗曚竴浠锋牸鎴栧涓疄闄呮椂娈靛鐞嗭紝璇锋牳瀵瑰悗鍐嶅鍒躲€俙 });
      if (!missing && !review) notices.push({ type: "", text: "鎵€鏈夌洰鏍囨椂娈靛潎璇嗗埆鍒拌嚦灏戜袱涓湁鏁堟€讳环銆備粛寤鸿瀵圭収鎴浘瀹屾垚鏈€缁堟牳楠屻€? });
      noticeStack.innerHTML = notices.map(item => `<div class="notice ${item.type}">${escapeHtml(item.text)}</div>`).join("");
    }

    function renderAudit() {
      if (!parsedSections.length) {
        auditBody.innerHTML = `<div class="audit-item">娌℃湁鍙睍绀虹殑璇嗗埆璁板綍銆?/div>`;
        return;
      }
      auditBody.innerHTML = parsedSections.map(section => {
        const groups = section.groups.length ? section.groups.map(group => `${group.source || "浠锋牸缁?}锝?{group.label}锛?{group.prices.map(v => Number(v).toFixed(4)).join(" / ")}`).join("锛?) : "鏈瘑鍒埌浠锋牸缁?;
        const duplicate = section.duplicates > 1 ? `锛涢噸澶嶅嚭鐜?${section.duplicates} 娆★紝宸插悎骞禶 : "";
        return `<div class="audit-item"><strong class="mono">${escapeHtml(section.label)}</strong>锝滃€欓€夋€讳环锛?span class="mono">${section.prices.map(v => v.toFixed(4)).join(" / ") || "鏃?}</span>${escapeHtml(duplicate)}<br>${escapeHtml(groups)}</div>`;
      }).join("");
    }

    function orderedSelectedRows() {
      const state = getRegionSelection();
      const selectedIds = resultRows.filter(row => row.selected).map(row => periodId(row.period));
      const orderedIds = [...state.order.filter(id => selectedIds.includes(id)), ...selectedIds.filter(id => !state.order.includes(id))];
      return orderedIds.map(id => resultRows.find(row => periodId(row.period) === id)).filter(Boolean);
    }

    function selectedValues() {
      return orderedSelectedRows().flatMap(row => [row.nonMember, row.member]).map(value => value === "" ? "" : Number(value).toFixed(4));
    }

    function moveCopyPeriod(id, direction) {
      const state = getRegionSelection();
      const index = state.order.indexOf(id);
      const target = index + direction;
      if (index < 0 || target < 0 || target >= state.order.length) return;
      [state.order[index], state.order[target]] = [state.order[target], state.order[index]];
      updateCopyPreview();
    }

    function updateCopyPreview() {
      const rows = orderedSelectedRows();
      const values = selectedValues();
      const labels = rows.flatMap(row => [`${row.period.name}闈炰細鍛榒, `${row.period.name}浼氬憳`]);
      const columnCount = Math.max(labels.length, 1);
      copyLabels.style.setProperty("--copy-count", columnCount);
      copyPreview.style.setProperty("--copy-count", columnCount);
      copyLabels.innerHTML = labels.map(label => `<span>${escapeHtml(label)}</span>`).join("");
      copyPreview.innerHTML = values.length
        ? values.map(value => `<span>${escapeHtml(value || "寰呰ˉ")}</span>`).join("")
        : `<span>鏈€夋嫨浠讳綍鏃舵</span>`;
      orderEditor.innerHTML = rows.length
        ? rows.map(row => {
            const id = periodId(row.period);
            return `<span class="order-pill"><span>${escapeHtml(row.period.name)} ${row.period.start}-${row.period.end}</span><button type="button" data-move="-1" data-period-id="${escapeHtml(id)}" aria-label="鍚戝墠绉诲姩">鈥?/button><button type="button" data-move="1" data-period-id="${escapeHtml(id)}" aria-label="鍚戝悗绉诲姩">鈥?/button></span>`;
          }).join("")
        : `<span class="panel-kicker">璇峰厛鍕鹃€夐渶瑕佸鍒剁殑鏃舵</span>`;
      orderEditor.querySelectorAll("button[data-move]").forEach(button => button.addEventListener("click", () => moveCopyPeriod(button.dataset.periodId, Number(button.dataset.move))));
    }

    async function copySelected() {
      const text = selectedValues().join("\t");
      if (!text) return;
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const helper = document.createElement("textarea");
        helper.value = text;
        document.body.appendChild(helper);
        helper.select();
        document.execCommand("copy");
        helper.remove();
      }
      const original = document.getElementById("copyBtn").textContent;
      document.getElementById("copyBtn").textContent = "宸插鍒?;
      setTimeout(() => document.getElementById("copyBtn").textContent = original, 1200);
    }

    regionSelect.addEventListener("change", () => {
      persistGeneralPreferences();
      renderSchedule();
      if (rawInput.value.trim()) analyse(); else renderEmptyRows();
    });
    effectiveMonth.addEventListener("change", () => { persistGeneralPreferences(); renderSchedule(); });
    // INTERNAL_SAMPLE_UNLOCK_START
    document.getElementById("unlockSamplesBtn").addEventListener("click", () => {
      const key = window.prompt("璇疯緭鍏ュ唴閮ㄦ牱渚嬪瘑閽?);
      if (key === INTERNAL_SAMPLE_KEY) {
        document.getElementById("sampleLock").hidden = true;
        document.getElementById("sampleTools").hidden = false;
      } else if (key !== null) {
        window.alert("瀵嗛挜涓嶆纭?);
      }
    });
    // INTERNAL_SAMPLE_UNLOCK_END
    document.getElementById("loadSampleBtn").addEventListener("click", () => { rawInput.value = SAMPLES[sampleSelect.value]; analyse(); });
    document.getElementById("analyseBtn").addEventListener("click", analyse);
    document.getElementById("resetResultBtn").addEventListener("click", analyse);
    document.getElementById("clearBtn").addEventListener("click", () => { rawInput.value = ""; renderEmptyRows(); });
    document.getElementById("selectAllBtn").addEventListener("click", () => {
      const state = getRegionSelection();
      resultRows.forEach(row => row.selected = true);
      state.selected = resultRows.map(row => periodId(row.period));
      state.order = [...state.order.filter(id => state.selected.includes(id)), ...state.selected.filter(id => !state.order.includes(id))];
      renderResults();
    });
    document.getElementById("selectNoneBtn").addEventListener("click", () => {
      const state = getRegionSelection();
      resultRows.forEach(row => row.selected = false);
      state.selected = [];
      state.order = [];
      renderResults();
    });
    document.getElementById("savePreferenceBtn").addEventListener("click", saveCurrentPreference);
    document.getElementById("restorePreferenceBtn").addEventListener("click", restoreRegionPreset);
    document.getElementById("copyBtn").addEventListener("click", copySelected);

    window.PriceWorkbench = { parseSections, chooseForTarget, REGION_CONFIGS };

    const startupParams = new URLSearchParams(window.location.search);
    const startupRegion = startupParams.get("region");
    if (startupRegion && REGION_CONFIGS[startupRegion]) regionSelect.value = startupRegion;
    else if (storedPreferences.lastRegion && REGION_CONFIGS[storedPreferences.lastRegion]) regionSelect.value = storedPreferences.lastRegion;
    if (storedPreferences.effectiveMonth && !startupParams.get("month")) effectiveMonth.value = storedPreferences.effectiveMonth;
    if (startupParams.get("month")) effectiveMonth.value = startupParams.get("month");
    renderSchedule();
    renderEmptyRows();
  </script>
</body>
</html>
